<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Graphique des intérêts annuels</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { max-width: 800px; margin-top: 20px; }
    .error { color: red; }
    button { margin: 5px; padding: 5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>Graphique des intérêts annuels gagnés</h1>
  <div id="error-message" class="error"></div>
  <button onclick="retourTableau()">Retour au tableau</button>

  <canvas id="interetsChart"></canvas>

  <script>
    let chartInstance = null;

    function displayError(message) {
      document.getElementById("error-message").textContent = message;
    }

    function chargerGraphique() {
      const interetsData = JSON.parse(localStorage.getItem('interetsData'));
      if (!interetsData || interetsData.length === 0) {
        displayError("Aucune donnée disponible pour afficher le graphique. Veuillez d'abord consulter le tableau.");
        return;
      }

      // Préparer les données pour Chart.js
      const annees = [...new Set(interetsData.map(item => item.annee))].sort();
      const etablissements = [...new Set(interetsData.map(item => item.etablissement))];
      const couleurs = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

      const datasets = etablissements.map((etablissement, index) => {
        const data = annees.map(annee => {
          const item = interetsData.find(d => d.annee == annee && d.etablissement == etablissement);
          return item ? parseFloat(item.totalInterets) : 0;
        });
        return {
          label: etablissement,
          data: data,
          backgroundColor: couleurs[index % couleurs.length],
          borderColor: couleurs[index % couleurs.length],
          borderWidth: 1
        };
      });

      // Détruire le graphique existant s'il y en a un
      if (chartInstance) {
        chartInstance.destroy();
      }

      // Créer le graphique
      ```chartjs
      {
        type: 'bar',
        data: {
          labels: annees,
          datasets: datasets
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Intérêts gagnés (€)'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Année'
              }
            }
          },
          plugins: {
            legend: {
              position: 'top'
            },
            title: {
              display: true,
              text: 'Intérêts annuels par établissement'
            }
          }
        }
      }
      ```
    }

    function retourTableau() {
      window.location.href = "interets.html";
    }

    // Initialisation
    chargerGraphique();
  </script>

</body>
</html>

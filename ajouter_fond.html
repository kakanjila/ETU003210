<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter ou modifier un fonds - BMOI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bmoi: {
                            primary: '#4C1D95',
                            secondary: '#7C3AED',
                            light: '#8B5CF6',
                            accent: '#A78BFA',
                            promo: '#DDD6FE'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50">
    <!-- Header Principal -->
    <header class="bg-bmoi-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bmoi-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-2xl font-bold">BMOI</span>
            </div>
            
            <nav class="hidden md:flex space-x-6">
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Tableau de bord</a>
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Déconnexion</a>
            </nav>
            
            <button class="md:hidden text-white focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Bannière Information Admin -->
    <div class="bg-gradient-to-r from-bmoi-primary to-bmoi-secondary text-white py-6">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-2xl md:text-3xl font-bold mb-2">Gestion des Fonds</h2>
            <p class="text-lg md:text-xl">Ajouter ou modifier un fonds disponible</p>
        </div>
    </div>

    <!-- Navigation Secondaire -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-center space-x-6 py-3 overflow-x-auto">
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Comptes</a>
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Épargne</a>
                <a href="simulation_test.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Simulation Simple Remboursement</a>
                <a href="simulation.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Details Remboursement Client</a>
                <a href="ajouter_fond.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Ajouter fond</a>
                <a href="pret.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Prêts</a>
                <a href="type.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Type Prets</a>
                <a href="interets.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">interets</a>
            </div>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6 md:p-8">
                <h1 class="text-2xl font-bold text-bmoi-primary mb-6 pb-2 border-b border-gray-200">Ajouter ou modifier un fonds</h1>
                
                <div class="space-y-6">
                    <input type="hidden" id="id_fonds">
                    
                    <div class="space-y-2">
                        <label for="nom_fonds" class="block text-sm font-medium text-gray-700">Nom du fonds</label>
                        <input type="text" id="nom_fonds" placeholder="Entrez le nom du fonds" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-bmoi-secondary focus:border-bmoi-secondary">
                    </div>
                    
                    <div class="space-y-2">
                        <label for="montant_total" class="block text-sm font-medium text-gray-700">Montant total (AR)</label>
                        <input type="number" id="montant_total" placeholder="0.00" step="0.01" min="0"
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-bmoi-secondary focus:border-bmoi-secondary">
                    </div>
                    
                    <div class="space-y-2">
                        <label for="montant_disponible" class="block text-sm font-medium text-gray-700">Montant disponible (AR)</label>
                        <input type="number" id="montant_disponible" placeholder="0.00" step="0.01" min="0"
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-bmoi-secondary focus:border-bmoi-secondary">
                    </div>
                    
                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <button onclick="ajouterOuModifier()" 
                                class="flex-1 bg-bmoi-primary hover:bg-bmoi-secondary text-white font-medium py-2 px-4 rounded-md transition duration-200">
                            Enregistrer
                        </button>
                        <a href="index.html" 
                           class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-md text-center transition duration-200">
                            Retour à la liste
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Menu (hidden by default) -->
    <div class="md:hidden fixed inset-0 bg-bmoi-primary z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="flex flex-col items-center justify-center h-full space-y-8">
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Tableau de bord</a>
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Déconnexion</a>
            <button class="absolute top-4 right-4 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const apiBase = "http://localhost/ETU003210/ws";

        function ajax(method, url, data, callback) {
            const xhr = new XMLHttpRequest();
            xhr.open(method, apiBase + url, true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.onreadystatechange = () => {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    callback(JSON.parse(xhr.responseText));
                }
            };
            xhr.send(data);
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function chargerFonds(id) {
            ajax("GET", `/fonds/${id}`, null, (data) => {
                document.getElementById("id_fonds").value = data.id_fonds;
                document.getElementById("nom_fonds").value = data.nom_fonds;
                document.getElementById("montant_total").value = data.montant_total;
                document.getElementById("montant_disponible").value = data.montant_disponible;
            });
        }

        function ajouterOuModifier() {
            const id = document.getElementById("id_fonds").value;
            const nom_fonds = document.getElementById("nom_fonds").value;
            const montant_total = document.getElementById("montant_total").value;
            const montant_disponible = document.getElementById("montant_disponible").value;

            if (!nom_fonds || !montant_total || !montant_disponible) {
                alert("Veuillez remplir tous les champs obligatoires.");
                return;
            }

            const data = `nom_fonds=${encodeURIComponent(nom_fonds)}&montant_total=${montant_total}&montant_disponible=${montant_disponible}`;

            if (id) {
                ajax("PUT", `/fonds/${id}`, data, () => {
                    window.location.href = "index.html";
                });
            } else {
                ajax("POST", "/fonds", data, () => {
                    window.location.href = "index.html";
                });
            }
        }

        // Script pour le menu mobile
        const mobileMenuButton = document.querySelector('header button');
        const mobileMenu = document.querySelector('.fixed.inset-0');
        
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.remove('hidden');
            setTimeout(() => {
                mobileMenu.classList.remove('opacity-0');
            }, 10);
        });
        
        document.querySelector('.fixed.inset-0 button').addEventListener('click', () => {
            mobileMenu.classList.add('opacity-0');
            setTimeout(() => {
                mobileMenu.classList.add('hidden');
            }, 300);
        });

        const fondId = getQueryParam("id");
        if (fondId) {
            chargerFonds(fondId);
        }
    </script>
</body>
</html>

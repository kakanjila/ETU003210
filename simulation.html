<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation des Prêts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bmoi: {
              primary: '#4C1D95',
              secondary: '#7C3AED',
              light: '#8B5CF6',
              accent: '#A78BFA',
              promo: '#DDD6FE'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
    }
    
    .montants-cles p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      max-width: 400px;
    }
    
    .montants-cles p span {
      font-weight: 500;
      color: #4C1D95;
    }
    
    .montants-cles p.total {
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 8px;
      margin-top: 12px;
    }
    
    .simulation-summary {
      margin-top: 20px;
      padding: 15px;
      background-color: #f3f4f6;
      border-radius: 8px;
    }
    
    .simulation-summary p {
      margin: 8px 0;
    }
    
    .simulation-summary p.total {
      font-weight: bold;
      font-size: 1.1em;
      color: #4C1D95;
    }
    
    .amortissement-table tr.past {
      background-color: #f0f0f0;
      color: #666;
    }
    
    .amortissement-table tr:hover {
      background-color: #f5f3ff;
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header comme dans le modèle BMOI -->
  <header class="bg-bmoi-primary text-white shadow-lg">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bmoi-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-2xl font-bold">BMOI</span>
      </div>
      
      <nav class="hidden md:flex space-x-6">
        <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Particuliers</a>
        <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Professionnels</a>
        <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Entreprises</a>
        <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">À propos</a>
        <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Contact</a>
      </nav>
      
      <button class="md:hidden text-white focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Bannière Admin -->
  <div class="bg-gradient-to-r from-bmoi-primary to-bmoi-secondary text-white py-6">
    <div class="container mx-auto px-4 text-center">
      <h2 class="text-2xl md:text-3xl font-bold mb-2">Gestion des Prêts</h2>
      <p class="text-lg md:text-xl">Simulation et suivi des remboursements</p>
    </div>
  </div>

  <!-- Navigation secondaire -->
  <nav class="bg-white shadow-md">
    <div class="container mx-auto px-4">
      <div class="flex justify-center space-x-6 py-3 overflow-x-auto">
        <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Comptes</a>
        <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Épargne</a>
        <a href="simulation.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-bmoi-secondary transition duration-200">Simulation Remboursement</a>
        <a href="ajouter_fond.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Ajouter fond</a>
        <a href="pret.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Prêts</a>
        <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Assurances</a>
      </div>
    </div>
  </nav>

  <!-- Contenu principal -->
  <main class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <h1 class="text-2xl font-bold text-bmoi-primary mb-6">Liste des prêts</h1>

      <div class="overflow-x-auto">
        <table id="prets-table" class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">ID</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Client</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Montant</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Durée</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Taux</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Assurance</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Action</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <div id="simulation" class="bg-white rounded-lg shadow-md p-6 hidden">
      <!-- Le contenu de la simulation sera injecté ici -->
    </div>
  </main>

  <script>
    const apiBase = "http://localhost/ETU003210/ws";

    function chargerPrets() {
      fetch(apiBase + "/prets")
        .then(r => r.json())
        .then(data => {
          const tbody = document.querySelector("#prets-table tbody");
          tbody.innerHTML = "";
          data.forEach(p => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-50";
            tr.innerHTML = `
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${p.id_pret}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.client_nom}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${parseFloat(p.montant).toLocaleString()} AR</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.duree_mois} mois</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.taux_interet}%</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.taux_assurance || 0}%</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <button onclick="simulerPret(${p.id_pret})" class="bg-bmoi-primary hover:bg-bmoi-secondary text-white font-medium py-1 px-3 rounded-md shadow-sm transition duration-200">
                  Simuler
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        });
    }

    function simulerPret(idPret) {
      fetch(apiBase + `/prets/${idPret}`)
        .then(response => {
          if (!response.ok) throw new Error("Erreur réseau");
          return response.json();
        })
        .then(pret => {
          // Validation des données
          if (!pret.montant || !pret.taux_interet || !pret.duree_mois || !pret.date_debut) {
            throw new Error("Données du prêt incomplètes");
          }

          // Extraction des données
          const montant = parseFloat(pret.montant);
          const tauxAnnuel = parseFloat(pret.taux_interet);
          const duree = parseInt(pret.duree_mois);
          const tauxAssuranceAnnuel = pret.taux_assurance ? parseFloat(pret.taux_assurance) : 0;

          // Calculs financiers
          const tauxMensuel = tauxAnnuel / 100 / 12;
          const mensualiteSansAssurance = parseFloat(
            ((montant * tauxMensuel) / (1 - Math.pow(1 + tauxMensuel, -duree))).toFixed(2)
          );

          // Assurance (calcul mensuel fixe sur capital initial)
          const assuranceMensuelle = tauxAssuranceAnnuel 
            ? parseFloat(((tauxAssuranceAnnuel / 100 * montant) / 12).toFixed(2))
            : 0;

          const mensualiteTotale = mensualiteSansAssurance + assuranceMensuelle;

          // Initialisation amortissement
          let capitalRestant = montant;
          const dateDebut = new Date(pret.date_debut);
          const aujourdHui = new Date();

          // Génération HTML
          let html = `
            <div class="simulation-header mb-6">
              <h2 class="text-xl font-bold text-bmoi-primary mb-4">Simulation du prêt #${pret.id_pret}</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                  <p class="mb-2"><strong class="text-bmoi-primary">Client:</strong> ${pret.client_nom || "Non spécifié"}</p>
                  <p class="mb-2"><strong class="text-bmoi-primary">Montant:</strong> ${montant.toLocaleString()} AR</p>
                  <p class="mb-2"><strong class="text-bmoi-primary">Durée:</strong> ${duree} mois</p>
                </div>
                <div>
                  <p class="mb-2"><strong class="text-bmoi-primary">Taux d'intérêt:</strong> ${tauxAnnuel}% (${(tauxMensuel * 100).toFixed(4)}% mensuel)</p>
                  <p class="mb-2"><strong class="text-bmoi-primary">Taux d'assurance:</strong> ${tauxAssuranceAnnuel}%</p>
                </div>
              </div>
              
              <div class="montants-cles bg-bmoi-promo p-4 rounded-lg mb-6">
                <p><span>Mensualité hors assurance:</span> ${mensualiteSansAssurance.toFixed(2)} AR</p>
                <p><span>Assurance mensuelle:</span> ${assuranceMensuelle.toFixed(2)} AR</p>
                <p class="total"><span>Mensualité totale:</span> ${mensualiteTotale.toFixed(2)} AR</p>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="amortissement-table min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Mois</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-bmoi-primary uppercase tracking-wider">Date</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-bmoi-primary uppercase tracking-wider">Intérêts</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-bmoi-primary uppercase tracking-wider">Capital</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-bmoi-primary uppercase tracking-wider">Assurance</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-bmoi-primary uppercase tracking-wider">Mensualité</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-bmoi-primary uppercase tracking-wider">Reste dû</th>
                  </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
          `;

          // Calcul du tableau d'amortissement
          for (let mois = 1; mois <= duree; mois++) {
            const datePaiement = new Date(dateDebut);
            datePaiement.setMonth(dateDebut.getMonth() + mois - 1);

            const interets = parseFloat((capitalRestant * tauxMensuel).toFixed(2));
            const capitalRembourse = parseFloat(
              Math.min(mensualiteSansAssurance - interets, capitalRestant).toFixed(2)
            );
            
            // Ajustement dernier mois
            const estDernierMois = mois === duree;
            const capitalAjuste = estDernierMois 
              ? parseFloat((capitalRembourse + (capitalRestant - capitalRembourse)).toFixed(2))
              : capitalRembourse;

            capitalRestant = parseFloat((capitalRestant - capitalAjuste).toFixed(2));

            // Ligne du tableau
            html += `
              <tr class="${datePaiement < aujourdHui ? 'past' : ''} hover:bg-gray-50">
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${mois}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${datePaiement.toLocaleDateString('fr-FR')}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 text-right">${interets.toFixed(2)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 text-right">${capitalAjuste.toFixed(2)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 text-right">${assuranceMensuelle.toFixed(2)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 text-right">${(capitalAjuste + interets + assuranceMensuelle).toFixed(2)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 text-right">${capitalRestant.toFixed(2)}</td>
              </tr>
            `;
          }

          html += `
                </tbody>
              </table>
            </div>
            <div class="simulation-summary mt-6">
              <p class="mb-2"><strong>Coût total des intérêts:</strong> ${((mensualiteSansAssurance * duree) - montant).toFixed(2)} AR</p>
              <p class="mb-2"><strong>Coût total de l'assurance:</strong> ${(assuranceMensuelle * duree).toFixed(2)} AR</p>
              <p class="total text-lg mt-4"><strong>Coût total du crédit:</strong> ${((mensualiteTotale * duree) - montant).toFixed(2)} AR</p>
            </div>
          `;

          // Injection dans le DOM
          const container = document.getElementById("simulation");
          container.innerHTML = html;
          container.classList.remove("hidden");
        })
        .catch(error => {
          console.error("Erreur:", error);
          document.getElementById("simulation").innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-500 p-4">
              <div class="flex">
                <div class="flex-shrink-0">
                  <svg class="h-5 w-5 text-red-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                  </svg>
                </div>
                <div class="ml-3">
                  <p class="text-sm text-red-700">Erreur lors de la simulation: ${error.message}</p>
                </div>
              </div>
            </div>
          `;
          container.classList.remove("hidden");
        });
    }
    

    document.addEventListener("DOMContentLoaded", chargerPrets);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMOI - Banque Malgache de l'Océan Indien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bmoi: {
                            primary: '#4C1D95',
                            secondary: '#7C3AED',
                            light: '#8B5CF6',
                            accent: '#A78BFA',
                            promo: '#DDD6FE'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans">
    <!-- Header Principal -->
    <header class="bg-bmoi-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bmoi-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-2xl font-bold">BMOI</span>
            </div>
            
            <nav class="hidden md:flex space-x-6">
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Particuliers</a>
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Professionnels</a>
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Entreprises</a>
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">À propos</a>
                <a href="#" class="hover:text-bmoi-accent transition duration-200 font-medium">Contact</a>
            </nav>
            
            <button class="md:hidden text-white focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

<!-- Bannière Information Admin -->
<div class="bg-gradient-to-r from-bmoi-primary to-bmoi-secondary text-white py-6">
    <div class="container mx-auto px-4 text-center">
        <h2 class="text-2xl md:text-3xl font-bold mb-2">Tableau de Bord Administrateur</h2>
        <p class="text-lg md:text-xl">Gestion complète des fonds, prêts et clients</p>
        <div class="mt-4 flex justify-center gap-4">
            <button class="bg-white text-bmoi-primary font-bold py-2 px-6 rounded-full hover:bg-gray-100 transition duration-200 shadow-lg">
                Statistiques
            </button>
            <button class="bg-bmoi-accent text-white font-bold py-2 px-6 rounded-full hover:bg-bmoi-light transition duration-200 shadow-lg">
                Rapports
            </button>
        </div>
    </div>
</div>
    <!-- Navigation Secondaire -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-center space-x-6 py-3 overflow-x-auto">
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Comptes</a>
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Épargne</a>
                <a href="simulation.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Simulation Remboursement</a>
                <a href="ajouter_fond.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Ajouter fond</a>
                <a href="pret.html" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Prêts</a>
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Assurances</a>
                <a href="#" class="whitespace-nowrap px-3 py-2 text-bmoi-primary font-medium hover:text-bmoi-secondary border-b-2 border-transparent hover:border-bmoi-secondary transition duration-200">Investissements</a>
            </div>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <main class="container mx-auto px-4 py-8">
        <!-- Votre contenu ici -->
    </main>

    <!-- Mobile Menu (hidden by default) -->
    <div class="md:hidden fixed inset-0 bg-bmoi-primary z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="flex flex-col items-center justify-center h-full space-y-8">
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Particuliers</a>
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Professionnels</a>
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Entreprises</a>
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">À propos</a>
            <a href="#" class="text-white text-xl font-medium hover:text-bmoi-accent">Contact</a>
            <button class="absolute top-4 right-4 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Script pour le menu mobile
        const mobileMenuButton = document.querySelector('header button');
        const mobileMenu = document.querySelector('.fixed.inset-0');
        
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.remove('hidden');
            setTimeout(() => {
                mobileMenu.classList.remove('opacity-0');
            }, 10);
        });
        
        document.querySelector('.fixed.inset-0 button').addEventListener('click', () => {
            mobileMenu.classList.add('opacity-0');
            setTimeout(() => {
                mobileMenu.classList.add('hidden');
            }, 300);
        });
    </script>
</body>
</html>

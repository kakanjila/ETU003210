<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Intérêts et paiements annuels</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    select, button { margin: 5px; padding: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .error { color: red; }
    .filter-group { margin-bottom: 10px; }
    canvas { max-width: 800px; margin-top: 20px; border: 1px solid black; }
    #total-paiements { margin-top: 20px; font-weight: bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>Intérêts et paiements annuels</h1>
  <div id="error-message" class="error"></div>

  <div class="filter-group">
    <label for="debut_mois">Mois de début :</label>
    <select id="debut_mois">
      <option value="">Tous</option>
      <option value="01">Janvier</option>
      <option value="02">Février</option>
      <option value="03">Mars</option>
      <option value="04">Avril</option>
      <option value="05">Mai</option>
      <option value="06">Juin</option>
      <option value="07">Juillet</option>
      <option value="08">Août</option>
      <option value="09">Septembre</option>
      <option value="10">Octobre</option>
      <option value="11">Novembre</option>
      <option value="12">Décembre</option>
    </select>
    <label for="debut_annee">Année de début :</label>
    <select id="debut_annee">
      <option value="">Toutes</option>
    </select>
    <label for="fin_mois">Mois de fin :</label>
    <select id="fin_mois">
      <option value="">Tous</option>
      <option value="01">Janvier</option>
      <option value="02">Février</option>
      <option value="03">Mars</option>
      <option value="04">Avril</option>
      <option value="05">Mai</option>
      <option value="06">Juin</option>
      <option value="07">Juillet</option>
      <option value="08">Août</option>
      <option value="09">Septembre</option>
      <option value="10">Octobre</option>
      <option value="11">Novembre</option>
      <option value="12">Décembre</option>
    </select>
    <label for="fin_annee">Année de fin :</label>
    <select id="fin_annee">
      <option value="">Toutes</option>
    </select>
    <button onclick="filtrerInterets()">Filtrer</button>
  </div>

  <div id="total-paiements">Total des paiements : 0.00 €</div>

  <table id="table-interets">
    <thead>
      <tr>
        <th>Année</th>
        <th>Établissement</th>
        <th>Intérêts gagnés (€)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Graphique des intérêts</h2>
  <canvas id="interetsChart"></canvas>

  <script>
    const apiBase = "http://localhost/ETU003210/ws";
    let chartInstance = null;
    let tableauData = [];

    function ajax(method, url, data, callback, errorCallback) {
      const xhr = new XMLHttpRequest();
      xhr.open(method, apiBase + url, true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            callback(JSON.parse(xhr.responseText));
          } else {
            errorCallback(`Erreur ${xhr.status}: ${xhr.responseText || xhr.statusText}`);
          }
        }
      };
      xhr.onerror = () => errorCallback("Erreur réseau lors de la requête.");
      xhr.send(data);
    }

    function displayError(message) {
      document.getElementById("error-message").textContent = message;
    }

    function remplirAnnees() {
      const debutAnnee = document.getElementById("debut_annee");
      const finAnnee = document.getElementById("fin_annee");
      const anneeActuelle = new Date().getFullYear();
      for (let i = anneeActuelle - 10; i <= anneeActuelle + 5; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = i;
        debutAnnee.appendChild(option.cloneNode(true));
        finAnnee.appendChild(option);
      }
    }

    function calculerInteretsAnnuels(pret, annee, debutMois, finMois) {
      if (pret.statut !== 'ACTIF') return 0;
      if (!pret.montant || !pret.taux_interet || !pret.date_debut || !pret.date_fin || !pret.id_fonds) {
        console.warn('Données de prêt incomplètes:', pret);
        return 0;
      }
      const dateDebut = new Date(pret.date_debut);
      const dateFin = new Date(pret.date_fin);
      const debutAnnee = new Date(annee, debutMois ? debutMois - 1 : 0, 1);
      const finAnnee = new Date(annee, finMois ? finMois - 1 : 11, 31);
      
      if (dateDebut <= finAnnee && dateFin >= debutAnnee) {
        return (pret.montant * pret.taux_interet / 100);
      }
      return 0;
    }

    function chargerInterets(debutMois, debutAnnee, finMois, finAnnee) {
      // Charger le total des paiements
      let urlPaiements = "/paiements/total";
      if (debutMois && debutAnnee && finMois && finAnnee) {
        urlPaiements += `/${debutMois}/${debutAnnee}/${finMois}/${finAnnee}`;
      } else {
        // Si pas de filtres, utiliser une période large par défaut (par exemple, 10 ans)
        const anneeActuelle = new Date().getFullYear();
        urlPaiements += `/01/${anneeActuelle - 10}/12/${anneeActuelle}`;
      }
      ajax("GET", urlPaiements, null, (paiementsData) => {
        console.log('Total paiements:', paiementsData);
        document.getElementById("total-paiements").textContent = `Total des paiements : ${parseFloat(paiementsData.total_paye || 0).toFixed(2)} €`;
      }, (error) => {
        displayError(`Erreur lors du chargement des paiements: ${error}`);
      });

      // Charger les intérêts
      ajax("GET", "/prets", null, (prets) => {
        console.log('Prêts reçus:', prets);
        ajax("GET", "/etablissements", null, (etablissements) => {
          console.log('Établissements reçus:', etablissements);
          const tbody = document.querySelector("#table-interets tbody");
          tbody.innerHTML = "";

          const etablissementMap = {};
          etablissements.forEach(e => {
            etablissementMap[e.id_etablissement] = e.nom;
          });

          const interetsParAnnee = {};
          prets.forEach(pret => {
            const dateDebut = new Date(pret.date_debut);
            const dateFin = new Date(pret.date_fin);
            const debut = debutAnnee ? new Date(debutAnnee, debutMois ? debutMois - 1 : 0) : dateDebut;
            const fin = finAnnee ? new Date(finAnnee, finMois ? finMois - 1 : 11, 31) : dateFin;

            for (let annee = debut.getFullYear(); annee <= fin.getFullYear(); annee++) {
              const cle = `${annee}-${pret.id_fonds}`;
              if (!interetsParAnnee[cle]) {
                interetsParAnnee[cle] = {
                  annee: annee,
                  id_etablissement: pret.id_fonds,
                  totalInterets: 0
                };
              }
              interetsParAnnee[cle].totalInterets += calculerInteretsAnnuels(pret, annee, debutMois, finMois);
            }
          });

          tableauData = Object.values(interetsParAnnee).map(item => ({
            annee: item.annee,
            etablissement: etablissementMap[item.id_etablissement] || 'Inconnu',
            totalInterets: item.totalInterets.toFixed(2)
          }));
          console.log('tableauData:', tableauData);

          tableauData.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${item.annee}</td>
              <td>${item.etablissement}</td>
              <td>${item.totalInterets}</td>
            `;
            tbody.appendChild(tr);
          });

          dessinerGraphique();
        }, (error) => {
          displayError(`Erreur lors du chargement des établissements: ${error}`);
        });
      }, (error) => {
        displayError(`Erreur lors du chargement des prêts: ${error}`);
      });
    }

    function filtrerInterets() {
      const debutMois = document.getElementById("debut_mois").value;
      const debutAnnee = document.getElementById("debut_annee").value;
      const finMois = document.getElementById("fin_mois").value;
      const finAnnee = document.getElementById("fin_annee").value;

      if ((debutMois && !debutAnnee) || (!debutMois && debutAnnee)) {
        displayError("Veuillez sélectionner à la fois le mois et l'année de début.");
        return;
      }
      if ((finMois && !finAnnee) || (!finMois && finAnnee)) {
        displayError("Veuillez sélectionner à la fois le mois et l'année de fin.");
        return;
      }
      if (debutMois && finMois && debutAnnee && finAnnee) {
        const debut = new Date(debutAnnee, debutMois - 1);
        const fin = new Date(finAnnee, finMois - 1);
        if (debut > fin) {
          displayError("La date de début doit être antérieure à la date de fin.");
          return;
        }
      }

      chargerInterets(debutMois, debutAnnee, finMois, finAnnee);
    }

    // Initialisation
    remplirAnnees();
    chargerInterets();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des fonds</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    a, button { margin: 5px; padding: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Gestion des fonds</h1>
  <div>
    <a href="ajouter_fond.html">Ajouter un nouveau fonds</a>
  </div>

  <table id="table-fonds">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom du fonds</th>
        <th>Montant total</th>
        <th>Montant disponible</th>
        <th>Date de création</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const apiBase = "http://localhost/ETU003210/ws";

    function ajax(method, url, data, callback) {
      const xhr = new XMLHttpRequest();
      xhr.open(method, apiBase + url, true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4 && xhr.status === 200) {
          callback(JSON.parse(xhr.responseText));
        }
      };
      xhr.send(data);
    }

    function chargerFonds() {
      ajax("GET", "/fonds", null, (data) => {
        const tbody = document.querySelector("#table-fonds tbody");
        tbody.innerHTML = "";
        data.forEach(f => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${f.id_fonds}</td>
            <td>${f.nom_fonds}</td>
            <td>${f.montant_total}</td>
            <td>${f.montant_disponible}</td>
            <td>${f.date_creation}</td>
            <td>
              <button onclick='modifierFonds(${f.id_fonds})'>✏️</button>
              <button onclick='supprimerFonds(${f.id_fonds})'>🗑️</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function modifierFonds(id) {
      window.location.href = `ajouter_fond.html?id=${id}`;
    }

    function supprimerFonds(id) {
      if (confirm("Supprimer ce fonds ?")) {
        ajax("DELETE", `/fonds/${id}`, null, () => {
          chargerFonds();
        });
      }
    }

    chargerFonds();
  </script>

</body>
</html>

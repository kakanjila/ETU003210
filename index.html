<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMOI - Banque Malgache de l'Océan Indien</title>
    <style>
        /* Styles généraux */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        /* Header */
        .header {
            background-color: #003366;
            color: white;
            padding: 15px 0;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Navigation principale */
        .main-nav {
            display: flex;
            gap: 20px;
        }
        
        .main-nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .main-nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        /* Bande promotionnelle */
        .promo-banner {
            background-color: #FF6B00;
            color: white;
            padding: 15px 0;
            text-align: center;
        }
        
        .promo-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .promo-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .promo-subtitle {
            font-size: 16px;
        }
        
        /* Menu secondaire */
        .secondary-nav {
            background-color: #f5f5f5;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .secondary-nav-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .secondary-nav a {
            color: #003366;
            text-decoration: none;
            font-weight: 500;
            padding: 5px 0;
            position: relative;
        }
        
        .secondary-nav a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #FF6B00;
            transition: width 0.3s;
        }
        
        .secondary-nav a:hover:after {
            width: 100%;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">BMOI</div>
            <nav class="main-nav">
                <a href="#">Particuliers</a>
                <a href="#">Professionnels</a>
                <a href="#">Entreprises</a>
                <a href="#">À propos</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
    
    <div class="promo-banner">
        <div class="promo-content">
            <div class="promo-title">Obtenez 400 000 Ar de remboursement</div>
            <div class="promo-subtitle">Lorsque vous refinancez votre prêt immobilier avec BMOI</div>
        </div>
    </div>
    
    <nav class="secondary-nav">
        <div class="secondary-nav-container">
            <a href="#">Comptes</a>
            <a href="#">Cartes</a>
            <a href="#">Épargne</a>
            <a href="#">Prêts</a>
            <a href="#">Assurances</a>
            <a href="#">Investissements</a>
        </div>
    </nav>
    
    <!-- Contenu principal de la page ici -->
</body>
</html>
